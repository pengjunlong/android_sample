# Project-wide Gradle settings.

# Gradle Daemon uses Java 17 (AGP 8.x requires JVM 17+)
org.gradle.java.home=/Users/pengjunlong/Library/Java/JavaVirtualMachines/azul-17.0.17/Contents/Home

# JVM args: max heap 4GB, UTF-8 encoding
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Enable parallel builds
org.gradle.parallel=true

# Enable Gradle build cache
org.gradle.caching=true

# Enable configuration cache
org.gradle.configuration-cache=true

# Use AndroidX
android.useAndroidX=true

# Non-transitive R class (recommended)
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

