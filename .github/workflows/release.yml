name: Release

on:
  push:
    tags:
      - 'v*.*.*'   # 匹配 v1.0.0、v2.3.1 等语义化版本 Tag

permissions:
  contents: write   # 需要写权限以创建 GitHub Release

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 获取完整 Git 历史，用于生成 Changelog

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 从 Tag 解析版本号 ──────────────────────────────────────────────────────
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"         # e.g. v1.2.3
          VERSION="${TAG#v}"                      # e.g. 1.2.3
          # 将 x.y.z 转为整数版本号（去掉点），如 1.2.3 → 10203
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          echo "tag=$TAG"           >> $GITHUB_OUTPUT
          echo "version=$VERSION"   >> $GITHUB_OUTPUT
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "📦 Tag: $TAG | Version: $VERSION | VersionCode: $VERSION_CODE"

      # ── 运行单元测试（Release 前必须通过）────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # ── 还原签名 Keystore ─────────────────────────────────────────────────────
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > $GITHUB_WORKSPACE/release.jks
          echo "✅ Keystore decoded to release.jks"

      # ── 构建签名 Release APK ───────────────────────────────────────────────────
      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.versionCode }}" \
            --stacktrace

      # ── 重命名 APK（方便辨识）────────────────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/release -name "*.apk" | while read f; do
            BASENAME=$(basename "$f" .apk)
            cp "$f" "artifacts/${BASENAME}-${{ steps.version.outputs.tag }}.apk"
          done
          echo "📂 Artifacts:"
          ls -lh artifacts/

      # ── 生成 Changelog（两个 Tag 之间的 commit 记录）─────────────────────────
      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG"     >> $GITHUB_OUTPUT
          echo "EOF"            >> $GITHUB_OUTPUT
          echo "📝 Changelog generated."

      # ── 创建 GitHub Release ────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## 📦 Android Framework Sample ${{ steps.version.outputs.tag }}

            **Version:** `${{ steps.version.outputs.version }}`
            **Version Code:** `${{ steps.version.outputs.versionCode }}`
            **Build:** `${{ github.sha }}`

            ### 📋 What's Changed

            ${{ steps.changelog.outputs.changelog }}

            ---
            > 构建时间：${{ github.event.head_commit.timestamp }}
          files: artifacts/*.apk
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          # Tag 包含 '-' 时标记为预发布，如 v1.0.0-beta.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 清理签名文件 ───────────────────────────────────────────────────────────
      - name: Cleanup keystore
        if: always()
        run: rm -f $GITHUB_WORKSPACE/release.jks

